name = "lynvo-webapp"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Keep variables and secrets set in the Cloudflare dashboard across deploys
# (BETTER_AUTH_SECRET, RESEND_API_KEY, SPLIT_DOMAINS...).
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "lynvo-db"
database_id = "4d645849-6b8b-483e-b3c8-2d79e2055c1a"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "lynvo-media"

[assets]
binding = "ASSETS"
directory = ".open-next/assets"

# One Worker serves all three domains; middleware.ts routes by host.
# Attach each domain under Workers & Pages -> lynvo-webapp -> Settings ->
# Domains & Routes, or uncomment to let `wrangler deploy` attach them.
# routes = [
#   { pattern = "app.lynvo.studio", custom_domain = true },
#   { pattern = "lynvo.studio", custom_domain = true },
#   { pattern = "www.lynvo.studio", custom_domain = true },
#   { pattern = "lynvo.tech", custom_domain = true },
#   { pattern = "www.lynvo.tech", custom_domain = true },
# ]
# ...
[vars]
APP_URL = "https://app.lynvo.studio/"
SITE_URL = "https://app.lynvo.studio"
STUDIO_URL = "https://lynvo.studio/"
TECH_URL = "https://lynvo.tech/"
# Secrets (BETTER_AUTH_SECRET, RESEND_API_KEY, CONTACT_NOTIFICATION_TO)
# must NOT live here: this file is committed, and any value here overrides the
# dashboard. Set them as encrypted secrets: `npx wrangler secret put NAME` or
# Workers & Pages -> lynvo-webapp -> Settings -> Variables and Secrets.
