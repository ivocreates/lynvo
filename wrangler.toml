name = "lynvo-webapp"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Without this, every `wrangler deploy` deletes the runtime variables set in the
# Cloudflare dashboard, which silently breaks all Supabase reads.
keep_vars = true

[assets]
binding = "ASSETS"
directory = ".open-next/assets"

# One Worker serves all three domains; middleware.ts routes by host.
# Attach each domain under Workers & Pages -> lynvo-webapp -> Settings ->
# Domains & Routes, or uncomment to let `wrangler deploy` attach them.
# routes = [
#   { pattern = "app.lynvo.studio", custom_domain = true },
#   { pattern = "lynvo.studio", custom_domain = true },
#   { pattern = "www.lynvo.studio", custom_domain = true },
#   { pattern = "lynvo.tech", custom_domain = true },
#   { pattern = "www.lynvo.tech", custom_domain = true },
# ]
